name: admin-kit

on:
  pull_request:
    paths: ['kits/admin/**', '.github/workflows/admin.yml']
  push:
    branches: [main]
    paths: ['kits/admin/**', '.github/workflows/admin.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: kits/admin

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: kits/admin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kits/admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
